name: Build Windows Application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper sounddevice numpy pyttsx3 pillow edge-tts pyinstaller

      - name: Run unit tests
        run: python test_nova.py

      - name: Build Windows installers and standalone app bundle
        run: python build_app.py --pyinstaller

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaAssistant-Windows-Build
          path: |
            dist/NovaAssistant-Setup.exe
            dist/NovaAssistant-Portable-Windows.zip
            dist/NovaAssistant-Standalone-Windows.zip

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NovaAssistant-Setup.exe
            dist/NovaAssistant-Portable-Windows.zip
            dist/NovaAssistant-Standalone-Windows.zip
